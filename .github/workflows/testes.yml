name: Testes

# Roda os testes automaticamente a cada push e pull request
on:
  push:
  pull_request:

jobs:
  testes:
    name: ${{ matrix.projeto }} (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # Se um projeto falhar, os outros continuam sendo testados
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
        projeto:
          - gerador-senhas
          - controle-gastos
          - raspador-precos
          - sistema-biblioteca
          - chat-tempo-real

    defaults:
      run:
        working-directory: ${{ matrix.projeto }}

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ${{ matrix.projeto }}/requirements*.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Rodar testes
        run: pytest -v
